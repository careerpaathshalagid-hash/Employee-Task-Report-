<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Pathshala - Task Panel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1e3a8a">
<meta name="description" content="Daily task scheduler for Career Pathshala">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CP Tasks">
<style>
  :root { --bg:#f5f6fa; --card:#fff; --text:#1d2433; --muted:#6b7280; --line:#e3e6ee;
          --primary:#2563eb; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  header { background:#0f172a; color:#fff; padding:12px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; }
  header h1 { font-size:17px; margin:0; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-logo { height:44px; width:auto; background:#fff; border-radius:8px; padding:4px 8px; flex-shrink:0; }
  .login-logo { display:flex; justify-content:center; margin-bottom:14px; }
  .login-brand { height:80px; width:auto; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:16px; margin:0 0 12px; }
  .note { background:#fef9c3; border:1px solid #fde68a; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:16px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .tabs button { background:#e5e7eb; }
  .tabs button.active { background:var(--primary); color:#fff; }
  button { cursor:pointer; border:0; border-radius:7px; padding:8px 14px; font:inherit; background:var(--primary); color:#fff; }
  button.ghost { background:#e5e7eb; color:var(--text); }
  button.danger { background:var(--bad); }
  button.ok { background:var(--ok); }
  button.small { padding:5px 10px; font-size:13px; }
  input, select, textarea { font:inherit; padding:8px 10px; border:1px solid #cbd2dd; border-radius:7px; width:100%; background:#fff; }
  textarea { min-height:60px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:10px; }
  label input, label select, label textarea { margin-top:4px; color:var(--text); }
  fieldset { border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin:0 0 12px; }
  legend { font-size:13px; color:var(--muted); padding:0 4px; }
  fieldset label { display:inline-flex; align-items:center; gap:6px; margin:4px 12px 4px 0; color:var(--text); }
  fieldset input[type=checkbox] { width:auto; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0 14px; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; font-weight:600; }
  .b-pending { background:#e5e7eb; color:#374151; }
  .b-complete { background:#dcfce7; color:var(--ok); }
  .b-incomplete, .b-missed { background:#fee2e2; color:var(--bad); }
  .row-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .reason-box { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .reason-box input { flex:1; min-width:180px; }
  .stats { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .stat { flex:1; min-width:120px; background:#f8fafc; border:1px solid var(--line); border-radius:8px; padding:10px; }
  .stat b { display:block; font-size:20px; }
  .muted { color:var(--muted); font-size:13px; }
  .login { max-width:360px; margin:60px auto; }
  @media (max-width:600px) { main { padding:12px; } }

  /* ---- Enhanced styling ---- */
  body { background:linear-gradient(180deg,#eef2ff 0%,var(--bg) 220px); min-height:100vh; }
  header { background:linear-gradient(135deg,#1e3a8a,#0f172a); box-shadow:0 2px 10px rgba(15,23,42,.15); position:sticky; top:0; z-index:10; }
  header h1 { font-size:18px; letter-spacing:.2px; }
  #hdr-right span { font-size:13px; opacity:.9; background:rgba(255,255,255,.12); padding:4px 10px; border-radius:99px; }
  #hdr-right button.ghost { background:rgba(255,255,255,.15); color:#fff; }
  #hdr-right button.ghost:hover { background:rgba(255,255,255,.25); }

  .card { box-shadow:0 1px 3px rgba(15,23,42,.06), 0 4px 14px rgba(15,23,42,.04); transition:box-shadow .2s, transform .2s; }
  .card:hover { box-shadow:0 2px 6px rgba(15,23,42,.08), 0 8px 22px rgba(15,23,42,.07); }
  .card h2 { font-size:15px; font-weight:700; color:#0f172a; display:flex; align-items:center; gap:8px; }
  .card h2::before { content:""; width:4px; height:16px; background:var(--primary); border-radius:4px; display:inline-block; }

  .note { background:linear-gradient(135deg,#fffbeb,#fef3c7); border:1px solid #fcd34d; color:#78350f; box-shadow:0 1px 2px rgba(0,0,0,.04); }

  .tabs { background:#fff; border:1px solid var(--line); border-radius:12px; padding:6px; display:inline-flex; box-shadow:0 1px 3px rgba(15,23,42,.05); }
  .tabs button { background:transparent; color:var(--muted); font-weight:600; }
  .tabs button:hover { background:#f1f5f9; color:var(--text); }
  .tabs button.active { background:var(--primary); color:#fff; box-shadow:0 2px 6px rgba(37,99,235,.35); }

  button { transition:background .15s, transform .05s, box-shadow .15s; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  button:hover { filter:brightness(1.06); }
  button:active { transform:translateY(1px); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid rgba(37,99,235,.35); outline-offset:1px; }
  button.ok { background:#16a34a; }
  button.danger { background:#dc2626; }
  button.ghost:hover { background:#d1d5db; }

  input:focus, select:focus, textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
  input, select, textarea { transition:border-color .15s, box-shadow .15s; }
  label { font-weight:500; }
  label input[type=checkbox], label input[type=radio] { accent-color:var(--primary); }

  fieldset { background:#fbfcfe; border:1px dashed #cdd5e1; margin-bottom:14px; }
  fieldset label { background:#fff; border:1px solid var(--line); border-radius:8px; padding:5px 10px; margin:4px 6px 4px 0; cursor:pointer; transition:border-color .15s, background .15s; }
  fieldset label:hover { border-color:#93c5fd; background:#f8fbff; }
  fieldset label:has(input:checked) { border-color:var(--primary); background:#eff6ff; color:#1e40af; font-weight:600; }

  table { border-spacing:0; }
  thead th { background:#f8fafc; position:sticky; top:0; text-transform:uppercase; font-size:11.5px; letter-spacing:.5px; padding:10px 8px; border-bottom:1px solid var(--line); }
  tbody tr { transition:background .12s; }
  tbody tr:hover { background:#f8fafc; }
  td { padding:10px 8px; }
  .table-wrap { border:1px solid var(--line); border-radius:10px; background:#fff; }
  .table-wrap table { min-width:520px; }
  .table-wrap tbody tr:last-child td { border-bottom:0; }

  .badge { padding:3px 10px; font-size:12px; letter-spacing:.2px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.04); }
  .b-pending { background:#eef2f7; color:#475569; }
  .b-complete { background:#dcfce7; color:#15803d; }
  .b-incomplete, .b-missed { background:#fee2e2; color:#b91c1c; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .stat { background:linear-gradient(180deg,#fff,#f8fafc); border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:0 1px 2px rgba(15,23,42,.04); color:var(--muted); font-size:13px; font-weight:500; }
  .stat b { font-size:24px; color:#0f172a; margin-bottom:2px; letter-spacing:-.3px; }
  .stat:nth-child(2) b { color:var(--ok); }
  .stat:nth-child(3) b { color:var(--bad); }
  .stat:nth-child(4) b { color:var(--warn); }

  .reason-box { background:#fff7f7; border:1px solid #fecaca; border-radius:10px; padding:10px; margin-top:10px; }
  .reason-box input { background:#fff; }

  .login { background:linear-gradient(180deg,#fff,#fafbff); border-radius:14px; padding:24px; box-shadow:0 10px 30px rgba(15,23,42,.10); }
  .login h2 { font-size:18px; }

  #app > h2 { font-size:20px; }
  #app > .muted { font-size:14px; }

  @media (max-width:600px) {
    header { padding:10px 12px; }
    header h1 { font-size:15px; }
    #hdr-right { width:100%; justify-content:space-between; flex-wrap:wrap; }
    .tabs { display:flex; width:100%; }
    .tabs button { flex:1; padding:8px 6px; font-size:13px; }
    .card { padding:14px; }
    .stats { grid-template-columns:1fr 1fr; }
    .row-actions button { flex:1; }
    .reason-box button { flex:1; }
  }

  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1220; --card:#111a2e; --text:#e5e9f2; --muted:#94a3b8; --line:#1f2b44; }
    body { background:linear-gradient(180deg,#0f1b33 0%,var(--bg) 260px); }
    .card h2 { color:var(--text); }
    .card { box-shadow:0 1px 3px rgba(0,0,0,.4); }
    input, select, textarea { background:#0b1220; color:var(--text); border-color:#2a3754; }
    label { color:var(--muted); }
    label input, label select, label textarea { color:var(--text); }
    .note { background:#2a2410; border-color:#6b5a1e; color:#fde68a; }
    .tabs { background:#111a2e; }
    .tabs button { color:var(--muted); }
    .tabs button:hover { background:#1a2540; color:var(--text); }
    button.ghost { background:#1f2b44; color:var(--text); }
    button.ghost:hover { background:#29385a; }
    fieldset { background:#0e1729; border-color:#2a3754; }
    fieldset label { background:#111a2e; border-color:#2a3754; color:var(--text); }
    fieldset label:has(input:checked) { background:#172554; color:#bfdbfe; }
    thead th { background:#0e1729; color:var(--muted); }
    tbody tr:hover { background:#152039; }
    .table-wrap { background:var(--card); border-color:var(--line); }
    .stat { background:linear-gradient(180deg,#131f38,#0f1a30); border-color:var(--line); }
    .stat b { color:var(--text); }
    .b-pending { background:#1f2b44; color:#cbd5e1; }
    .b-complete { background:#052e16; color:#86efac; }
    .b-incomplete, .b-missed { background:#450a0a; color:#fca5a5; }
    .reason-box { background:#2a1212; border-color:#7f1d1d; }
    .login { background:linear-gradient(180deg,#131f38,#0f1a30); }
  }

  /* ---- v2 additions ---- */
  .tabs { max-width:100%; overflow-x:auto; }
  .tabs button { white-space:nowrap; }
  .btn { display:inline-block; text-decoration:none; padding:5px 10px; border-radius:7px; font-size:13px; font-weight:600; background:#e5e7eb; color:#1d2433; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .btn:hover { filter:brightness(1.06); }
  .btn.wa { background:#16a34a; color:#fff; }
  .btn.mail { background:#2563eb; color:#fff; }
  .btn.cal { background:#f59e0b; color:#fff; }
  .btn.disabled { opacity:.4; pointer-events:none; }
  .wrap { white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; }
  .clamp { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .cell-text { min-width:200px; max-width:420px; }
  .counter { display:block; text-align:right; font-size:11px; color:var(--muted); margin-top:2px; }
  textarea { min-height:90px; resize:vertical; }
  .b-overdue { background:#fef3c7; color:#b45309; }
  .b-late { background:#ede9fe; color:#6d28d9; }
  .filters { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin:10px 0 14px; }
  .filters label { margin:0; }
  .filters input, .filters select { width:auto; }
  .inline-input { min-width:130px; padding:5px 8px; }
  .sheet-chip { font-size:12px; padding:4px 10px; border-radius:99px; background:rgba(255,255,255,.14); color:#fff; }
  .sheet-chip.err { background:#b91c1c; }
  .sheet-chip.ok { background:rgba(22,163,74,.55); }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:50; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .toast-item { background:#0f172a; color:#fff; padding:10px 16px; border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.3); font-size:14px; max-width:90vw; }
  .toast-item.err { background:#b91c1c; }
  .progress { height:8px; background:#e5e7eb; border-radius:99px; overflow:hidden; min-width:80px; }
  .progress > i { display:block; height:100%; background:var(--ok); }
  .stat.n b { color:var(--text); }
  .stat.ok b { color:var(--ok); }
  .stat.bad b { color:var(--bad); }
  .stat.warn b { color:var(--warn); }
  .section-title { margin:18px 0 8px; font-size:15px; }
  @media (max-width:600px) { .cell-text { min-width:150px; } .filters input, .filters select { width:100%; } .filters label { flex:1; min-width:130px; } }
  @media (prefers-color-scheme: dark) {
    .btn { background:#1f2b44; color:var(--text); }
    .btn.wa { background:#15803d; color:#fff; } .btn.mail { background:#1d4ed8; color:#fff; } .btn.cal { background:#b45309; color:#fff; }
    .b-overdue { background:#422006; color:#fcd34d; }
    .b-late { background:#2e1065; color:#c4b5fd; }
    .progress { background:#1f2b44; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img class="brand-logo" data-logo alt="Career Pathshala logo">
    <h1>Career Pathshala · Task Panel</h1>
  </div>
  <div id="hdr-right" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"></div>
</header>

<main>
  <div class="note">
    Data is saved in this browser. To sync with Google Sheets, paste the Web App URL in Admin &rarr; Settings.
    This demo has no login password. The Email / WhatsApp / Calendar buttons are in Admin &rarr; Today and Tasks.
  </div>
  <div id="app"></div>
</main>
<div id="toast"></div>

const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return ymd(d); };
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const monthStart = () => todayStr().slice(0, 8) + '01';
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clip = (s, n) => String(s ?? '').slice(0, n);
const cell = v => (typeof v === 'string' && /^[=+\-@\t\r]/.test(v)) ? "'" + v : v;
const fmtTime = iso => iso ? new Date(iso).toLocaleString() : '';

/* ---------- data ---------- */
function seed() {
  return {
    users: [
      { id:'u_admin', name:'Admin', role:'admin', phone:'', email:'' },
      { id:'u_e1', name:'Employee 1', role:'employee', phone:'', email:'' },

    ],
    tasks: [], instances: [],
    settings: { adminReminder:'14:00', sheetUrl:'', finalizedThrough:'' },

}
function migrate(d) {
  d.users.forEach(u => { u.phone ??= ''; u.email ??= ''; });
  d.tasks.forEach(t => { delete t.penalty; t.joined ??= {}; t.weekdays ??= []; t.channels ??= []; t.assignees ??= []; t.description ??= ''; t.remarks ??= ''; });
  d.settings ??= {};
  d.settings.adminReminder ??= '14:00';
  d.settings.sheetUrl = SHEET_URL_RE.test(d.settings.sheetUrl || '') ? d.settings.sheetUrl : '';
  d.settings.finalizedThrough ??= '';
  return d;
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.users) && Array.isArray(d.tasks) && Array.isArray(d.instances)) return migrate(d);
  } catch {}
  return seed();
}
let db = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch { toast('Could not save data (browser storage is blocked or full). Please download a backup.', 'err'); }
}

const userName = id => userById(id)?.name || '?';

/* ---------- schedule logic ---------- */
function appliesOn(t, date) {
  if (t.startDate > date) return false;
  if (t.frequency === 'daily') return true;
  if (t.frequency === 'weekly') return t.weekdays.includes(parseDay(date).getDay());
  if (t.frequency === 'alternate') {
    const diff = Math.round((parseDay(date) - parseDay(t.startDate)) / 864e5);
    return diff % 2 === 0;
  }
  return false;
}

function ensureRange(from, to) {
  const added = new Set();
  const have = new Set(db.instances.map(i => `${i.taskId}|${i.employeeId}|${i.date}`));
  for (const t of db.tasks) {
    for (const emp of t.assignees) {
      let d = t.joined[emp] || t.startDate;
      if (d < from) d = from;
      for (; d <= to; d = addDays(d, 1)) {
        if (!appliesOn(t, d)) continue;
        const k = `${t.id}|${emp}|${d}`;
        if (have.has(k)) continue;
        have.add(k);
        db.instances.push({ id: uid(), taskId: t.id, employeeId: emp, date: d, status: 'pending', completedAt: null, markedAt: null, reason: '' });
        added.add(d);
      }
    }
  }
  if (added.size) save();
  return added;
}
const backfill = () => ensureRange(addDays(todayStr(), -MAX_BACKFILL), todayStr());

function effStatus(inst, t) {
  if (inst.status !== 'pending') return inst.status;
  const today = todayStr();
  if (inst.date < today) return 'missed';
  if (inst.date === today && t && nowHM() > t.dueTime) return 'overdue';
  return 'pending';
}
const isLate = (inst, t) => inst.status === 'complete' && inst.completedAt && t && new Date(inst.completedAt) > new Date(inst.date + 'T' + t.dueTime + ':00');

function setStatus(instId, status, reason = '') {
  const inst = db.instances.find(i => i.id === instId);
  if (!inst) return;
  inst.status = status;
  inst.markedAt = status === 'pending' ? null : new Date().toISOString();
  inst.completedAt = status === 'complete' ? inst.markedAt : null;
  inst.reason = status === 'incomplete' ? reason : '';
  save();
  syncDay(inst.date);
}

function reportRows(from, to, empId = 'all') {
  const tasks = new Map(db.tasks.map(t => [t.id, t]));
  const users = new Map(db.users.map(u => [u.id, u]));
  const out = [];
  for (const i of db.instances) {
    if (i.date < from || i.date > to) continue;
    if (empId !== 'all' && i.employeeId !== empId) continue;
    const t = tasks.get(i.taskId), e = users.get(i.employeeId);
    if (!t || !e) continue;
    const status = effStatus(i, t);
    out.push({ inst: i, task: t, date: i.date, employeeId: e.id, employee: e.name, title: t.title, due: t.dueTime,
      status, late: isLate(i, t), completedAt: i.completedAt, reason: i.reason });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date) || a.employee.localeCompare(b.employee) || a.due.localeCompare(b.due));
}
const statusText = r => (r.status === 'complete' && r.late) ? 'complete (late)' : r.status;

function summarize(rows) {
  const by = {};
  for (const r of rows) {
    const s = by[r.employee] ||= { total:0, done:0, late:0, notdone:0, open:0 };
    s.total++;
    if (r.status === 'complete') { s.done++; if (r.late) s.late++; }
    else if (r.status === 'incomplete' || r.status === 'missed') s.notdone++;
    else s.open++;
  }
  return by;
}

/* ---------- Google Sheet sync (queued, one at a time) ---------- */
let sheetQ = Promise.resolve();
const sheetState = { sent: null, err: false, busy: 0 };
function postSheet(payload) {
  const url = db.settings.sheetUrl;
  if (!url || !SHEET_URL_RE.test(url)) return;
  sheetState.busy++; updateSheetChip();
  sheetQ = sheetQ
    .then(() => fetch(url, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }))
    .then(() => { sheetState.sent = new Date(); sheetState.err = false; })
    .catch(() => { sheetState.err = true; })
    .finally(() => { sheetState.busy--; updateSheetChip(); });
}
let tasksTimer;
function syncTasks() { clearTimeout(tasksTimer); tasksTimer = setTimeout(doSyncTasks, 400); }
function doSyncTasks() {
  postSheet({
    action: 'replaceTasks',
    rows: db.tasks.map(t => [t.id, cell(t.title), t.frequency, t.weekdays.map(i => DAYS[i]).join(', '),
      t.startDate, t.reminderTime, t.dueTime, t.channels.join(', '),
      cell(t.assignees.map(userName).join(', ')), cell(t.remarks)]),
  });
}
let empTimer;
function syncEmployees() { clearTimeout(empTimer); empTimer = setTimeout(doSyncEmployees, 600); }
function doSyncEmployees() {
  postSheet({ action: 'replaceEmployees', rows: employees().map(u => [cell(u.name), cell(u.email), cell(u.phone)]) });
}
function syncDay(date) {
  const now = new Date().toLocaleString();
  postSheet({
    action: 'replaceDay', date,
    rows: reportRows(date, date).map(r => [date, cell(r.employee), cell(r.title), r.due, statusText(r),
      fmtTime(r.completedAt), cell(r.reason), now]),
  });
}
function syncAll() {
  doSyncTasks();
  doSyncEmployees();
  const dates = [...new Set(db.instances.map(i => i.date))].sort();
  dates.forEach(syncDay);
  return dates.length;
}
function finalizePastDays() {
  if (!db.settings.sheetUrl) return;
  const yesterday = addDays(todayStr(), -1);
  const dates = [...new Set(db.instances.map(i => i.date))].sort();
  if (!dates.length) return;
  let from = db.settings.finalizedThrough ? addDays(db.settings.finalizedThrough, 1) : dates[0];
  if (from < addDays(todayStr(), -MAX_BACKFILL)) from = addDays(todayStr(), -MAX_BACKFILL);
  dates.filter(d => d >= from && d <= yesterday).forEach(syncDay);
  db.settings.finalizedThrough = yesterday;
  save();
}
function sheetChipHtml() {
  if (!db.settings.sheetUrl || session?.role !== 'admin') return '';
  return `<span id="sheetChip" class="sheet-chip" title="The browser can only send data; it cannot read the sheet's confirmation."></span>`;
}
function updateSheetChip() {
  const el = document.getElementById('sheetChip');
  if (!el) return;
  el.className = 'sheet-chip' + (sheetState.err ? ' err' : sheetState.sent ? ' ok' : '');
  el.textContent = sheetState.busy ? 'Sheet: sending...' : sheetState.err ? 'Sheet: send failed'
    : sheetState.sent ? 'Sheet: sent ' + sheetState.sent.toLocaleTimeString() : 'Sheet: connected';
}

/* ---------- reminders / contact links ---------- */
function notify(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body });
}
function checkReminders() {
  if (!session) return;
  const hm = nowHM(), today = todayStr();
  if (session.role === 'employee') {
    for (const r of reportRows(today, today, session.id)) {
      if (r.inst.status !== 'pending' || !r.task.channels.includes('desktop')) continue;
      const key = r.inst.id + ':' + r.task.reminderTime;
      if (r.task.reminderTime <= hm && !remindedKeys.has(key)) {
        remindedKeys.add(key);
        notify('Task reminder: ' + r.title, 'Due by ' + r.due);
      }
    }
  } else if (hm >= db.settings.adminReminder && !adminReminded.has(today)) {
    adminReminded.add(today);
    const open = reportRows(today, today).filter(r => r.inst.status === 'pending').length;
    notify('Career Pathshala', `${open} task(s) are still pending today.`);
  }
}
function reminderMsg(u, r) {
  return `Hello ${u.name}, reminder: "${r.title}" must be completed by ${r.due} today.` +
    '\n- Career Pathshala';
}
function waLink(u, msg) {
  let d = (u.phone || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.length === 10) d = '91' + d;
  return `https://wa.me/${d}?text=${encodeURIComponent(msg)}`;
}
const mailLink = (u, msg) => u.email ? `mailto:${encodeURIComponent(u.email)}?subject=${encodeURIComponent('Task reminder')}&body=${encodeURIComponent(msg)}` : '';
function nextOccurrence(t) {
  let d = todayStr();
  if (d < t.startDate) d = t.startDate;
  for (let i = 0; i < 14; i++, d = addDays(d, 1)) if (appliesOn(t, d)) return d;
  return todayStr();
}
function gcalLink(t) {
  const d = nextOccurrence(t).replace(/-/g, '');
  const a = t.reminderTime.replace(':', '') + '00';
  const e = (t.dueTime > t.reminderTime ? t.dueTime : t.reminderTime).replace(':', '') + '00';
  const rr = t.frequency === 'weekly' ? 'FREQ=WEEKLY;BYDAY=' + t.weekdays.map(i => RRDAY[i]).join(',')
    : t.frequency === 'alternate' ? 'FREQ=DAILY;INTERVAL=2' : 'FREQ=DAILY';
  const details = clip([t.description, t.remarks && 'Remarks: ' + t.remarks].filter(Boolean).join('\n'), 1500);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(t.title) + '&dates=' + d + 'T' + a + '/' + d + 'T' + e
    + '&details=' + encodeURIComponent(details) + '&recur=' + encodeURIComponent('RRULE:' + rr);
}
const linkBtn = (href, cls, label) => href
  ? `<a class="btn ${cls} small" target="_blank" rel="noopener" href="${esc(href)}">${label}</a>`
  : `<span class="btn ${cls} disabled small" title="Contact detail missing">${label}</span>`;

/* ---------- ui helpers ---------- */
function toast(msg, type) {
  const box = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'toast-item' + (type === 'err' ? ' err' : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), type === 'err' ? 6000 : 3000);
}
function badge(status, late) {
  const map = { complete:'Complete', incomplete:'Incomplete', missed:'Missed', pending:'Pending', overdue:'Overdue' };
  return `<span class="badge b-${status}">${map[status]}</span>` + (late ? ' <span class="badge b-late">Late</span>' : '');
}
const counterHtml = max => `<span class="counter" data-max="${max}"></span>`;
function initCounters() {
  document.querySelectorAll('textarea[maxlength], input[data-counter]').forEach(el => {
    const c = el.parentElement.querySelector('.counter');
    if (c) c.textContent = `${el.value.length} / ${c.dataset.max}`;
  });
}

function login(userId) {

  session = { id: u.id, name: u.name, role: u.role };

  render();
}

    </select></label>` : ''}
    <button class="small ghost" data-act="range" data-scope="${scope}" data-r="today">Today</button>
    <button class="small ghost" data-act="range" data-scope="${scope}" data-r="7">Last 7 days</button>
    <button class="small ghost" data-act="range" data-scope="${scope}" data-r="month">This month</button>
  </div>`;
}

function detailTable(rows, showEmp) {
  const body = rows.map(r => `<tr>
    <td>${esc(r.date)}</td>${showEmp ? `<td>${esc(r.employee)}</td>` : ''}<td class="cell-text"><b>${esc(r.title)}</b></td>
    <td>${esc(r.due)}</td><td>${badge(r.status, r.late)}</td>
    <td>${r.completedAt ? new Date(r.completedAt).toLocaleTimeString() : '-'}</td>
    <td class="cell-text wrap">${esc(r.reason) || '-'}</td></tr>`).join('');
  return `<div class="table-wrap"><table>
    <thead><tr><th>Date</th>${showEmp ? '<th>Employee</th>' : ''}<th>Task</th><th>Due</th><th>Status</th><th>Completed at</th><th>Reason</th></tr></thead>
    <tbody>${body || `<tr><td colspan="${showEmp ? 7 : 6}" class="muted">No entries in this range.</td></tr>`}</tbody></table></div>`;
}

function reportTab() {
  const rows = reportRows(rep.from, rep.to, rep.emp);
  const by = summarize(rows);
  const tot = rows.length, done = rows.filter(r => r.status === 'complete').length;
  const summary = Object.entries(by).map(([name, s]) => `<tr>
    <td>${esc(name)}</td><td>${s.total}</td><td>${s.done}${s.late ? ` <span class="muted">(${s.late} late)</span>` : ''}</td>
    <td>${s.notdone}</td><td>${s.open}</td>
    <td><div class="progress"><i style="width:${s.total ? Math.round(s.done * 100 / s.total) : 0}%"></i></div>${s.total ? Math.round(s.done * 100 / s.total) : 0}%</td></tr>`).join('');
  return `
    <div class="card">
      <div class="row-actions" style="justify-content:space-between;align-items:center;">
        <h2 style="margin:0">Report</h2>
        <div class="row-actions">
          <button class="small ghost" data-act="csv">Download CSV</button>
          <button class="small" data-act="syncNow">Send to Google Sheet</button>
        </div>
      </div>
      ${filtersHtml('rep', rep, true)}
      <div class="stats">
        ${statBox(tot, 'Total tasks')}${statBox(done, 'Complete', 'ok')}${statBox(tot - done, 'Not complete', 'bad')}
      </div>
      <h2 class="section-title">Employee summary</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Employee</th><th>Total</th><th>Done</th><th>Incomplete / Missed</th><th>Open</th><th>Completion</th></tr></thead>
        <tbody>${summary || '<tr><td colspan="6" class="muted">No tasks in this range.</td></tr>'}</tbody>
      </table></div>
      <h2 class="section-title">Details</h2>
      ${detailTable(rows, true)}
    </div>`;
}

function settingsTab() {
  const s = db.settings;
  return `
    <div class="card">
      <h2>Reminders and Google Sheet</h2>
      <form id="settingsForm">
        <div class="grid2">
          <label>Daily admin reminder time <input type="time" name="adminReminder" value="${esc(s.adminReminder)}"></label>
          <label>Google Sheet Web App URL (optional)
            <input name="sheetUrl" value="${esc(s.sheetUrl)}" placeholder="https://script.google.com/macros/s/.../exec"></label>
        </div>
        <button type="submit">Save</button>
      </form>
      <p class="muted">Admin reminders and desktop notifications only work while this page is open. Only script.google.com URLs are allowed.</p>
    </div>
    <div class="card">
      <h2>Google Sheet sync</h2>
      <p class="muted">Tasks, statuses and employees are sent to the sheet automatically whenever they change. To send all existing data at once, click:</p>
      <button data-act="syncNow">Sync all now</button>
    </div>
    <div class="card">
      <h2>Backup</h2>
      <p class="muted">Data is stored only in this browser. Download a backup regularly.</p>
      <div class="row-actions">
        <button class="ghost" data-act="backup">Download backup</button>
        <label class="btn" style="cursor:pointer;margin:0;font-size:15px;padding:8px 14px">Restore backup<input type="file" id="restoreFile" accept="application/json,.json" hidden></label>
        <button class="danger" data-act="resetAll">Reset all data</button>
      </div>
    </div>`;
}

/* ---------- employee views ---------- */
function taskCard(r) {
  const i = r.inst, t = r.task, open = i.status === 'pending', today = todayStr();
  let actions;
  if (open) {
    actions = `<div class="row-actions">
      <button class="small ok" data-act="complete" data-id="${esc(i.id)}">Complete</button>
      <button class="small danger" data-act="openIncomplete" data-id="${esc(i.id)}">Incomplete</button>
      ${t.channels.includes('calendar') ? linkBtn(gcalLink(t), 'cal', 'Add to Calendar') : ''}</div>
      ${pendingIncomplete === i.id ? `
        <div class="reason-box" style="display:block">
          <label style="margin:0">Reason for incomplete (required)
            <textarea id="reason-${esc(i.id)}" maxlength="${LIM.text}" rows="3" placeholder="Write the full details...">${esc(drafts[i.id] || '')}</textarea>${counterHtml(LIM.text)}</label>
          <div class="row-actions" style="margin-top:8px">
            <button class="small danger" data-act="saveIncomplete" data-id="${esc(i.id)}">Save</button>
            <button class="small ghost" data-act="cancelIncomplete">Cancel</button>
          </div>
        </div>` : ''}`;
  } else {
    actions = `<div class="muted wrap">${i.markedAt ? 'Marked: ' + esc(fmtTime(i.markedAt)) : ''}${i.reason ? '\nReason: ' + esc(i.reason) : ''}</div>
      <div style="margin-top:8px"><button class="small ghost" data-act="reopen" data-id="${esc(i.id)}">Change status</button></div>`;
  }
  return `<div class="card">
    <div class="row-actions" style="justify-content:space-between;align-items:center">
      <b>${esc(t.title)}</b><span>${badge(r.status, r.late)}</span>
    </div>
    <div class="muted">${r.date !== today ? esc(r.date) + ' · ' : ''}Due ${esc(t.dueTime)}</div>
    ${t.remarks ? `<p class="wrap" style="margin:8px 0 0"><b>Remarks:</b> ${esc(t.remarks)}</p>` : ''}
    ${t.description ? `<p class="wrap" style="margin:8px 0">${esc(t.description)}</p>` : ''}
    ${actions}
  </div>`;
}

function renderEmployee() {
  const today = todayStr();
  const tabs = [['today', 'Today'], ['history', 'History']];
  const tabsHtml = `<div class="tabs">${tabs.map(([k, l]) => `<button class="${empTab === k ? 'active' : ''}" data-act="empTab" data-tab="${k}">${l}</button>`).join('')}</div>`;
  let body;
  if (empTab === 'history') {
    const rows = reportRows(hist.from, hist.to, session.id);
    const done = rows.filter(r => r.status === 'complete').length;
    body = `<div class="card"><h2>My history</h2>${filtersHtml('hist', hist, false)}
      <div class="stats">${statBox(rows.length, 'Total')}${statBox(done, 'Complete', 'ok')}${statBox(rows.length - done, 'Not complete', 'bad')}</div>
      ${detailTable(rows.slice().reverse(), false)}</div>`;
  } else {
    const all = reportRows(addDays(today, -MAX_BACKFILL), today, session.id);
    const todays = all.filter(r => r.date === today);
    const older = all.filter(r => r.date < today && r.inst.status === 'pending').reverse();
    const month = all.filter(r => r.date >= monthStart());
    body = `
      <div class="stats">
        ${statBox(`${todays.filter(r => r.status === 'complete').length} / ${todays.length}`, 'Completed today', 'ok')}
        ${statBox(todays.filter(r => r.inst.status === 'pending').length, 'Pending today')}
        ${statBox(month.filter(r => r.status === 'incomplete' || r.status === 'missed').length, 'Missed this month', 'bad')}
      </div>
      <h2 style="margin:0 0 4px">Today's tasks</h2>
      <div class="muted" style="margin-bottom:12px">${today}</div>
      ${todays.map(taskCard).join('') || '<div class="card muted">No tasks for today.</div>'}
      ${older.length ? `<h2 class="section-title">Pending from earlier days (${older.length})</h2>${older.map(taskCard).join('')}` : ''}`;
  }
  document.getElementById('app').innerHTML = tabsHtml + body;
}

function render() {
  renderHeader();
  if (!session) renderLogin();
  else if (session.role === 'admin') renderAdmin();
  else renderEmployee();
  initCounters();
}

/* ---------- export / backup ---------- */
const csvCell = v => `"${String(cell(v) ?? '').replace(/"/g, '""')}"`;
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function downloadCsv() {
  const rows = reportRows(rep.from, rep.to, rep.emp);
  const lines = [['Date','Employee','Task','Due','Status','Completed at','Reason'].map(csvCell).join(',')];
  rows.forEach(r => lines.push([r.date, r.employee, r.title, r.due, statusText(r), fmtTime(r.completedAt), r.reason].map(csvCell).join(',')));
  download(`report-${rep.from}_to_${rep.to}.csv`, '﻿' + lines.join('\n'), 'text/csv;charset=utf-8');
}
function restoreBackup(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.users) || !Array.isArray(d.tasks) || !Array.isArray(d.instances)) throw new Error('bad');
      if (!confirm('This will replace your current data. Continue?')) return;
      db = migrate(d); save();
      if (session && !userById(session.id)) logout(); else render();
      toast('Backup restored.');
    } catch { toast('This is not a valid backup file.', 'err'); }
  };
  r.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'login': return login(document.getElementById('loginUser').value);
    case 'logout': return logout();
    case 'install':
      if (!installPrompt) return;
      installPrompt.prompt();
      installPrompt.userChoice.finally(() => { installPrompt = null; renderHeader(); });
      return;
    case 'notif': if ('Notification' in window) Notification.requestPermission().then(renderHeader); return;
    case 'tab': adminTab = el.dataset.tab; editingId = null; return render();
    case 'empTab': empTab = el.dataset.tab; return render();
    case 'editTask': editingId = id; adminTab = 'tasks'; render(); return window.scrollTo({ top: 0, behavior: 'smooth' });
    case 'cancelEdit': editingId = null; return render();
    case 'delTask':
      if (!confirm('This task and all its entries will be deleted. Continue?')) return;
      db.tasks = db.tasks.filter(t => t.id !== id);
      db.instances = db.instances.filter(i => i.taskId !== id);
      if (editingId === id) editingId = null;
      save(); syncTasks(); return render();
    case 'delEmp':
      if (!confirm('Remove this employee? Their entries will be deleted too.')) return;
      db.users = db.users.filter(u => u.id !== id);
      db.tasks.forEach(t => { t.assignees = t.assignees.filter(a => a !== id); delete t.joined[id]; });
      db.instances = db.instances.filter(i => i.employeeId !== id);
      save(); syncTasks(); syncEmployees(); return render();
    case 'complete': setStatus(id, 'complete'); return render();
    case 'openIncomplete': pendingIncomplete = id; render(); return document.getElementById('reason-' + id)?.focus();
    case 'cancelIncomplete': delete drafts[pendingIncomplete]; pendingIncomplete = null; return render();
    case 'saveIncomplete': {
      const reason = document.getElementById('reason-' + id).value.trim();
      if (reason.length < 3) return toast('A reason is required for Incomplete (at least 3 characters).', 'err');
      setStatus(id, 'incomplete', reason);
      delete drafts[id]; pendingIncomplete = null; return render();
    }
    case 'reopen': setStatus(id, 'pending'); return render();
    case 'range': {
      const f = el.dataset.scope === 'rep' ? rep : hist, t = todayStr();
      f.to = t; f.from = el.dataset.r === 'today' ? t : el.dataset.r === '7' ? addDays(t, -6) : monthStart();
      return render();
    }
    case 'csv': return downloadCsv();
    case 'syncNow':
      if (!db.settings.sheetUrl) return toast('Save the Google Sheet URL in Settings first.', 'err');
      toast(`Sending ${syncAll()} day(s) of data to the sheet...`); return;
    case 'backup': return download(`cp-backup-${todayStr()}.json`, JSON.stringify(db, null, 1), 'application/json');
    case 'resetAll':
      if (!confirm('ALL data (tasks, employees, reports) will be deleted. Take a backup first. Continue?')) return;
      db = seed(); save(); editingId = null; return render();
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'restoreFile' && t.files[0]) { restoreBackup(t.files[0]); t.value = ''; return; }
  if (t.dataset.filter !== undefined) {
    const f = t.dataset.scope === 'rep' ? rep : hist;
    if (t.value || t.dataset.key === 'emp') { f[t.dataset.key] = t.value; render(); }
    return;
  }
  if (t.dataset.empField) {
    const u = userById(t.dataset.id);
    if (!u) return;
    const field = t.dataset.empField, val = t.value.trim();
    if (field === 'name' && !val) { t.value = u.name; return toast('Name cannot be empty.', 'err'); }
    if (field === 'email' && val && !EMAIL_RE.test(val)) { t.value = u.email; return toast('Invalid email (for example name@gmail.com).', 'err'); }
    u[field] = val; save();
    if (field === 'name') syncTasks();
    syncEmployees();
    if (field === 'email') { const w = t.parentElement.querySelector('[data-emp-warn]'); if (w) w.style.display = val ? 'none' : ''; }
    toast('Saved.');
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.tagName === 'TEXTAREA') {
    const c = t.parentElement.querySelector('.counter');
    if (c) c.textContent = `${t.value.length} / ${c.dataset.max}`;
    if (t.id.startsWith('reason-')) drafts[t.id.slice(7)] = t.value;
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target, fd = new FormData(form);

  if (form.id === 'taskForm') {
    const t = {
      title: clip(fd.get('title').trim(), LIM.title),
      description: clip(fd.get('description').trim(), LIM.text),
      remarks: clip(fd.get('remarks').trim(), LIM.text),
      frequency: fd.get('frequency'),
      weekdays: fd.getAll('weekdays').map(Number),
      startDate: fd.get('startDate'),
      reminderTime: fd.get('reminderTime'),
      dueTime: fd.get('dueTime'),
      channels: fd.getAll('channels'),
      assignees: fd.getAll('assignees'),
    };
    if (!t.title) return toast('Title is required.', 'err');
    if (!t.assignees.length) return toast('Select at least one employee.', 'err');
    if (t.frequency === 'weekly' && !t.weekdays.length) return toast('Select at least one weekday for a weekly task.', 'err');
    if (t.reminderTime > t.dueTime) return toast('Reminder time must be before the due time.', 'err');
    if (t.startDate < todayStr() && !confirm('The start date is in the past. Earlier days will be counted as "Missed". Continue?')) return;

    let added = new Set();
    if (editingId) {
      const old = db.tasks.find(x => x.id === editingId);
      const today = todayStr();
      t.assignees.forEach(a => { if (!old.assignees.includes(a)) old.joined[a] = today; });
      Object.assign(old, t, { id: old.id, joined: old.joined, createdBy: old.createdBy });
      db.instances = db.instances.filter(i => !(i.taskId === old.id && i.date >= today && i.status === 'pending'
        && (!old.assignees.includes(i.employeeId) || !appliesOn(old, i.date))));
      added = ensureRange(addDays(today, -MAX_BACKFILL), today);
      editingId = null;
      toast('Task updated.');
    } else {
      db.tasks.push({ id: uid(), joined: {}, createdBy: session.id, ...t });
      added = backfill();
      toast('Task created.');
    }
    save(); syncTasks();
    added.forEach(syncDay); syncDay(todayStr());
    return render();
  }

  if (form.id === 'empForm') {
    const name = clip(fd.get('name').trim(), LIM.name);
    if (!name) return;
    db.users.push({ id: uid(), name, role: 'employee', phone: clip(fd.get('phone').trim(), 20), email: clip(fd.get('email').trim(), 200) });
    save(); syncTasks(); syncEmployees(); toast('Employee added.');
    return render();
  }

  if (form.id === 'settingsForm') {
    const url = fd.get('sheetUrl').trim();
    if (url && !SHEET_URL_RE.test(url)) return toast('The URL must start with https://script.google.com/...', 'err');
    db.settings.adminReminder = fd.get('adminReminder') || '14:00';
    db.settings.sheetUrl = url;
    adminReminded.clear();
    save(); toast('Settings saved.');
    return render();
  }
});

/* ---------- start ---------- */
document.querySelectorAll('img[data-logo]').forEach(i => { i.src = LOGO; });
if (session && !userById(session.id)) { session = null; localStorage.removeItem(SESSION_KEY); }
const startAdded = backfill();
render();
finalizePastDays();
startAdded.forEach(syncDay);

let lastDay = todayStr();
function softRefresh() {
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  if (session && (session.role === 'employee' || (session.role === 'admin' && adminTab === 'today'))) render();
}
setInterval(() => {
  if (todayStr() !== lastDay) {
    lastDay = todayStr();
    backfill().forEach(syncDay);
    finalizePastDays();
    render();
  } else softRefresh();
  checkReminders();
}, 30000);
checkReminders();

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; renderHeader(); });
window.addEventListener('appinstalled', () => { installPrompt = null; renderHeader(); toast('App installed.'); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
